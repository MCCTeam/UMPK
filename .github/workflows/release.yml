name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing annotated release tag to publish"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-pack:
    name: validate + pack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
      - name: Validate release tag and project version
        id: version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be a SemVer release tag such as v0.9.0 or v1.0.0-rc.1" >&2
            exit 1
          fi
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" "refs/heads/master:refs/remotes/origin/master"
          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]]; then
            echo "Release tags must be annotated tags" >&2
            exit 1
          fi
          release_commit=$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")
          if ! git merge-base --is-ancestor "$release_commit" origin/master; then
            echo "Release tag must point to a commit on master" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          project_version=$(dotnet msbuild src/Umpk/Umpk.csproj -nologo -getProperty:Version)
          if [[ "$project_version" != "$version" ]]; then
            echo "Tag $RELEASE_TAG does not match Directory.Build.props Version $project_version" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: dotnet restore UMPK.sln
      - run: dotnet build UMPK.sln --no-restore -c Release
      - name: Test with count gate
        shell: bash
        run: |
          set -o pipefail
          dotnet test UMPK.sln --no-build -c Release 2>&1 | tee /tmp/umpk-test.log
          python3 engineering/testcounts/check_test_counts.py /tmp/umpk-test.log --baseline engineering/testcounts/expected_counts.json
      - run: dotnet format UMPK.sln --verify-no-changes --no-restore
      - run: dotnet run --project tools/Umpk.DataGen --no-build -c Release -- verify --data data/java
      - name: Verify generated outputs are current
        run: |
          dotnet run --project tools/Umpk.DataGen --no-build -c Release -- generate --data data/java --out src/Umpk.Data.Java --out-lang src/Umpk.Data.Lang --protocol-out src/Umpk.Protocol.Java
          git diff --exit-code data/java src/Umpk.Data.Java src/Umpk.Data.Lang src/Umpk.Protocol.Java
      - name: Pack release artifacts
        run: dotnet pack UMPK.sln --no-build -c Release -o artifacts/packages -p:PackageVersion=${{ steps.version.outputs.version }}
      - name: Verify package contents and metadata
        run: python3 engineering/release/verify_packages.py --packages artifacts/packages --version ${{ steps.version.outputs.version }}
      - name: Create checksums
        working-directory: artifacts/packages
        run: sha256sum *.nupkg *.snupkg > SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: nuget-${{ steps.version.outputs.version }}
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 30

  publish-nuget:
    name: publish to NuGet.org
    needs: build-and-pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: nuget-${{ needs.build-and-pack.outputs.version }}
          path: artifacts/packages
      - name: Exchange GitHub OIDC token for a short-lived NuGet key
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish packages and symbols
        shell: bash
        run: |
          shopt -s nullglob
          packages=(artifacts/packages/*.nupkg)
          if (( ${#packages[@]} == 0 )); then
            echo "No primary packages found" >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

  github-release:
    name: create GitHub release
    needs: [build-and-pack, publish-nuget]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: nuget-${{ needs.build-and-pack.outputs.version }}
          path: artifacts/packages
      - name: Create release and attach packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build-and-pack.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            for asset in artifacts/packages/*; do
              asset_name="${asset##*/}"
              if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$asset_name"; then
                echo "Release asset already exists: $asset_name"
              else
                gh release upload "$RELEASE_TAG" "$asset"
              fi
            done
          else
            gh release create "$RELEASE_TAG" artifacts/packages/* --verify-tag --generate-notes --title "UMPK ${{ needs.build-and-pack.outputs.version }}"
          fi
