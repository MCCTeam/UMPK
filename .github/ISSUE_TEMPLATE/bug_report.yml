name: Bug report
description: Report behavior that is wrong or inconsistent.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, private server details, and account data before submission.
  - type: input
    id: version
    attributes:
      label: UMPK version or commit
      description: Give the package version or full commit hash.
      placeholder: 0.9.0 or a full commit hash
    validations:
      required: true
  - type: input
    id: minecraft
    attributes:
      label: Minecraft version and protocol
      description: Include both values when known.
      placeholder: 1.21.11, protocol 774
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed result and the expected result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest sequence that reproduces the problem.
      placeholder: |
        1. Configure the client.
        2. Connect to the server.
        3. Observe the result.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or protocol evidence
      description: Paste a short redacted excerpt. Attach large logs only when a maintainer asks for them.
      render: text
  - type: dropdown
    id: baseline
    attributes:
      label: Did this work in an earlier UMPK version?
      options:
        - Unknown
        - "Yes"
        - "No"
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Submission checks
      options:
        - label: I removed credentials, tokens, private server addresses, and personal data.
          required: true
        - label: I searched existing issues for this problem.
          required: true
